# Include inside both TLS server blocks for retrozetrocomics.com.
# This preserves the existing A and AAAA records and proxies only to the
# loopback-bound Node service.

location = /api/internal/dbinfo {
	return 404;
}

location / {
	client_max_body_size 16m;
	proxy_http_version 1.1;
	proxy_pass http://127.0.0.1:3006;
	proxy_connect_timeout 3s;
	proxy_send_timeout 30s;
	proxy_read_timeout 30s;
	proxy_next_upstream off;

	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Internal-Diagnostics-Key "";
	proxy_set_header Connection "";
	proxy_hide_header Server;
	proxy_hide_header X-Powered-By;
	proxy_hide_header Content-Security-Policy;
	proxy_hide_header X-Frame-Options;

	# Preserve the route-specific application policy while preventing an inherited
	# fleet policy from widening it for the owner console.
	add_header Content-Security-Policy $upstream_http_content_security_policy always;
	add_header X-Frame-Options $upstream_http_x_frame_options always;
	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
}
