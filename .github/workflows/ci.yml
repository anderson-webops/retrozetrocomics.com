name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CYPRESS_INSTALL_BINARY: "0"
  NODE_VERSION: 24.18.1
  NPM_VERSION: 12.0.2
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use the repository npm version
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: Clean locked install
        run: npm ci --include=optional --strict-allow-scripts

      - name: Dependency and supply-chain gates
        run: |
          npm run audit
          npm run audit:production
          npm run audit:signatures
          npm run verify:dependency-graph
          npm run verify:native-lock
          npm run verify:platform-install

      - name: Application gates
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          git diff --check

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use the repository npm version
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci --include=optional --strict-allow-scripts

      - name: Axe accessibility smoke checks
        run: npm run a11y

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use the repository npm version
        run: npm install --global "npm@${NPM_VERSION}"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies and Cypress
        run: |
          npm ci --include=optional --strict-allow-scripts
          env -u CYPRESS_INSTALL_BINARY npx cypress install
          env -u CYPRESS_INSTALL_BINARY npx cypress verify

      - name: Build frontend
        run: npm run -w front-end build

      - name: Browser workflow tests
        uses: cypress-io/github-action@fa4a118725a8f001170d49631ea89e5d66fee626 # v7.4.1
        with:
          install: false
          working-directory: front-end
          config-file: cypress.config.ts
          start: npm run preview -- --port 3333
          wait-on: "http://localhost:3333"

  native-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use the repository npm version
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Validate ARM64 install and build
        run: |
          npm ci --include=optional --strict-allow-scripts
          npm run verify:native-lock
          npm run typecheck
          npm test
          npm run build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build pinned production image
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          docker build \
            --build-arg RETROZETRO_RELEASE_VERSION="v${PACKAGE_VERSION}" \
            --build-arg SOURCE_REVISION=0000000000000000000000000000000000000000 \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --tag retrozetro:test \
            .

      - name: Exercise read-only production image
        run: |
          test "$(docker run --rm --entrypoint id retrozetro:test -u)" != "0"
          for package_manager in npm npx corepack pnpm pnpx yarn yarnpkg; do
            if docker run --rm --entrypoint sh retrozetro:test -c "command -v ${package_manager}"; then
              echo "${package_manager} must not be present in the runtime image." >&2
              exit 1
            fi
          done

          docker run -d \
            --name retrozetro-test \
            --publish 127.0.0.1:8080:8080 \
            --env SESSION_SECRET=ci-container-session-secret-at-least-thirty-two-characters \
            --env PUBLIC_SITE_ORIGIN=https://retrozetrocomics.com \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --tmpfs /app/back-end/uploads:rw,noexec,nosuid,size=32m,uid=1000,gid=1000 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --entrypoint node \
            retrozetro:test \
            --input-type=module \
            -e 'import { createApp } from "./back-end/dist/app.js"; createApp().listen(8080);'
          trap 'docker rm --force retrozetro-test >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/api/healthz >/dev/null; then
              break
            fi
            if test "$(docker inspect --format '{{.State.Running}}' retrozetro-test)" != "true"; then
              docker logs retrozetro-test
              exit 1
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs retrozetro-test
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/release.json |
            grep -Fq '"revision": "0000000000000000000000000000000000000000"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8080/api/not-public)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --header 'Origin: https://attacker.invalid' \
            --header 'Sec-Fetch-Site: cross-site' \
            --data '{}' \
            http://127.0.0.1:8080/api/contact)" = "403"
          test -z "$(curl --silent --dump-header - --output /dev/null \
            --header 'Origin: https://attacker.invalid' \
            http://127.0.0.1:8080/api/healthz |
            tr -d '\r' |
            grep -i '^access-control-allow-origin:' || true)"
          curl --silent --dump-header - --output /dev/null http://127.0.0.1:8080/ |
            tr -d '\r' |
            grep -i '^content-security-policy:' |
            grep -Fq "script-src"
          if curl --silent --dump-header - --output /dev/null http://127.0.0.1:8080/ |
            tr -d '\r' |
            grep -i '^content-security-policy:' |
            grep -Eq "script-src[^;]*'unsafe-(inline|eval)'"; then
            echo "Production script policy must not allow unsafe-inline or unsafe-eval." >&2
            exit 1
          fi
