name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CYPRESS_INSTALL_BINARY: "0"
  NODE_VERSION: 24.18.1
  NPM_VERSION: 12.0.2
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use the repository npm version
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: Clean locked install
        run: npm ci --include=optional --strict-allow-scripts

      - name: Dependency and supply-chain gates
        run: |
          npm run audit
          npm run audit:production
          npm run audit:signatures
          npm run verify:dependency-graph
          npm run verify:deploy-assets
          npm run verify:install-scripts
          npm run verify:native-lock
          npm run verify:platform-install

      - name: Application gates
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run verify:startup-diagnostics
          git diff --check

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use the repository npm version
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci --include=optional --strict-allow-scripts

      - name: Axe accessibility smoke checks
        run: npm run a11y

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use the repository npm version
        run: npm install --global "npm@${NPM_VERSION}"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies and Cypress
        run: |
          npm ci --include=optional --strict-allow-scripts
          env -u CYPRESS_INSTALL_BINARY npx cypress install
          env -u CYPRESS_INSTALL_BINARY npx cypress verify

      - name: Build frontend
        run: npm run -w front-end build

      - name: Browser workflow tests
        uses: cypress-io/github-action@fa4a118725a8f001170d49631ea89e5d66fee626 # v7.4.1
        with:
          install: false
          working-directory: front-end
          config-file: cypress.config.ts
          start: npm run preview -- --port 3333
          wait-on: "http://localhost:3333"

  native-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use the repository npm version
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Validate ARM64 install and build
        run: |
          npm ci --include=optional --strict-allow-scripts
          npm run verify:native-lock
          npm run typecheck
          npm test
          npm run build

  direct-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use the repository npm version
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Build exact direct-runtime candidate
        run: |
          npm ci --include=optional --strict-allow-scripts
          export RETROZETRO_RELEASE_VERSION="v$(node -p "require('./package.json').version")"
          export SOURCE_REVISION=0000000000000000000000000000000000000000
          export SOURCE_DATE_EPOCH=1
          npm run build
          npm run verify:startup-diagnostics
          npm run verify:production-install
          npm run verify:direct-runtime
