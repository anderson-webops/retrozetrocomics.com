[build]
publish = "front-end/dist"
command = "npm run build:netlify"

[build.environment]
NODE_VERSION = "24.18.1"
NPM_VERSION = "12.0.2"
CYPRESS_INSTALL_BINARY = "0"
PUPPETEER_SKIP_DOWNLOAD = "true"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/manifest.webmanifest"

[headers.values]
Content-Type = "application/manifest+json"
